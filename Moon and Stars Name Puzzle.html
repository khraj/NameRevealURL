<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Moon and Stars Name Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Jost:wght@400;500&display=swap">
<style>
  /* Layout: a left-aligned masthead above one centred puzzle board; loose pieces rest in a tray beneath it.
     Single committed night-sky look, so the colours below are the only theme. */
  :root {
    --night: #090c26;
    --ink: #11154a;
    --slot: #0c1033;
    --rose: #c46b8f;
    --gold: #f2d38b;
    --moon: #fbf0cf;
    --mist: #a9afdc;
    --line: rgba(242, 211, 139, 0.3);
    --display: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
    --body: 'Jost', 'Futura', 'Avenir Next', 'Trebuchet MS', system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body {
    background-color: var(--night);
    background-image: radial-gradient(120% 60% at 85% 0%, rgba(74, 47, 133, 0.35), rgba(9, 12, 38, 0) 60%),
                      radial-gradient(90% 50% at 0% 100%, rgba(196, 107, 143, 0.12), rgba(9, 12, 38, 0) 70%);
    color: var(--moon);
    font: 400 1rem/1.5 var(--body);
  }
  .page { width: 100%; max-width: 1080px; margin-inline: auto; padding-inline: 16px; padding-block: 28px 64px; overflow-x: clip; }

  .eyebrow { display: flex; align-items: center; gap: 0.7rem; margin: 0 0 0.9rem; font: 500 0.72rem/1 var(--body); letter-spacing: 0.26em; text-transform: uppercase; color: var(--gold); }
  .eyebrow::before { content: ""; width: 15px; height: 15px; border-radius: 50%; box-shadow: inset 4.5px -1px 0 0 var(--gold); transform: rotate(-20deg); }
  h1 { margin: 0; max-width: 16ch; font: 500 clamp(2.2rem, 6.2vw, 4rem)/1.04 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
  .sub { margin: 0.9rem 0 0; max-width: 58ch; color: var(--mist); font-size: 1.02rem; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; margin-block: 26px 22px; }
  .seg { display: inline-flex; }
  .btn, .seg button {
    font: 500 0.72rem/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--gold); background: transparent; border: 1px solid var(--line); border-radius: 2px;
    padding: 0.85rem 1.05rem; min-height: 44px; cursor: pointer; display: inline-flex; align-items: center;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .seg button + button { border-left-width: 0; }
  .btn:hover, .seg button:hover { border-color: var(--gold); }
  .seg button[aria-pressed="true"] { background: var(--gold); color: var(--night); border-color: var(--gold); }
  .btn[aria-pressed]::before { content: ""; width: 0.55em; height: 0.55em; border-radius: 50%; margin-right: 0.7em; border: 1px solid var(--gold); }
  .btn[aria-pressed="true"]::before { background: var(--gold); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .progress { display: flex; align-items: center; gap: 12px; color: var(--mist); font-size: 0.85rem; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
  .track { position: relative; width: clamp(80px, 14vw, 160px); height: 2px; background: rgba(169, 175, 220, 0.25); }
  .track i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--gold); box-shadow: 0 0 10px var(--gold); transition: width 0.3s ease; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }

  .stage { position: relative; width: 100%; min-height: 320px; overflow-x: clip; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: height 0.7s ease; }
  .stage.dragging { cursor: grabbing; }
  .board { position: absolute; z-index: 0; background: var(--slot); box-shadow: 0 0 0 1px var(--line), 0 28px 70px rgba(0, 0, 0, 0.55); transition: box-shadow 0.8s; }
  .stage.done .board { box-shadow: 0 0 0 1px var(--gold), 0 0 90px rgba(242, 211, 139, 0.28); }
  .board canvas { position: absolute; left: 0; top: 0; transition: opacity 0.3s; }
  .stage.noguide #ghost { opacity: 0; }

  .piece { position: absolute; left: 0; top: 0; z-index: 10; pointer-events: none; will-change: transform; filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.55)); -webkit-user-drag: none; }
  .piece.lift { filter: drop-shadow(0 14px 14px rgba(0, 0, 0, 0.6)); }
  .piece.placed { filter: none; }

  .reveal { position: absolute; z-index: 5000; pointer-events: none; overflow: hidden; }
  .reveal canvas { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity 0.9s ease; }
  .reveal.on canvas { opacity: 1; }
  .nameplate { position: absolute; inset: 0; isolation: isolate; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-top: calc(var(--bw) * 0.07); }
  .nameplate::before { content: ""; position: absolute; inset: 10% 4%; z-index: -1; background: radial-gradient(closest-side, rgba(8, 10, 35, 0.68), rgba(8, 10, 35, 0)); }
  .np-kicker { margin: 0; padding-left: 0.42em; font: 500 max(10px, calc(var(--bw) * 0.022))/1 var(--body); letter-spacing: 0.42em; text-transform: uppercase; color: var(--gold); opacity: 0; }
  .np-first { margin: 0.05em 0 0.08em; font: italic 500 calc(var(--bw) * 0.2)/0.98 var(--display); color: var(--moon); text-shadow: 0 0 calc(var(--bw) * 0.05) rgba(242, 211, 139, 0.45); }
  .np-first span { display: inline-block; opacity: 0; }
  .np-rest { margin: 0; padding-left: 0.34em; font: 500 max(13px, calc(var(--bw) * 0.052))/1 var(--body); letter-spacing: 0.34em; text-transform: uppercase; color: var(--gold); opacity: 0; }
  @keyframes rise { from { opacity: 0; transform: translateY(0.3em); } to { opacity: 1; transform: none; } }
  .reveal.on .np-kicker { animation: rise 0.8s 0.6s both; }
  .reveal.on .np-first span { animation: rise 0.9s calc(0.85s + var(--i) * 0.13s) cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  .reveal.on .np-rest { animation: rise 0.9s 1.6s both; }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .reveal canvas, .stage, .track i { transition: none; }
    .reveal.on .np-kicker, .reveal.on .np-first span, .reveal.on .np-rest { animation: none; opacity: 1; transform: none; }
  }
</style>

<main class="page">
  <header>
    <p class="eyebrow">Moon &amp; stars, a little surprise</p>
    <h1 id="title">Who is our newest little star?</h1>
    <p class="sub" id="sub">Drag each piece into the night sky.</p>
  </header>

  <section class="bar" aria-label="Puzzle controls">
    <div class="seg" role="group" aria-label="Number of pieces">
      <button type="button" data-n="12" aria-pressed="false">12 pieces</button>
      <button type="button" data-n="24" aria-pressed="false">24 pieces</button>
      <button type="button" data-n="48" aria-pressed="false">48 pieces</button>
    </div>
    <div class="progress"><span id="count">0 of 24 in place</span><div class="track"><i id="fill"></i></div></div>
    <div class="tools">
      <button type="button" class="btn" id="btnGuide" aria-pressed="true">Guide</button>
      <button type="button" class="btn" id="btnSound" aria-pressed="true">Sound</button>
      <button type="button" class="btn" id="btnShuffle">Shuffle</button>
      <button type="button" class="btn" id="btnReveal">Reveal now</button>
      <button type="button" class="btn" id="btnReplay" hidden>Replay reveal</button>
      <button type="button" class="btn" id="btnFull">Full screen</button>
    </div>
  </section>

  <div class="stage" id="stage" role="group" aria-label="Jigsaw board">
    <div class="board" id="board">
      <canvas id="ghost"></canvas>
      <canvas id="grid"></canvas>
    </div>
    <div class="reveal" id="reveal">
      <canvas id="final"></canvas>
      <div class="nameplate" id="nameplate"></div>
    </div>
  </div>
  <p class="sr" id="live" aria-live="polite"></p>
</main>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(() => {
  'use strict';
  const FIRST = 'Myra', REST = 'Adhiti Raj', FULL = FIRST + ' ' + REST;
  const LEVELS = { 12: { cols: 4, rows: 3 }, 24: { cols: 6, rows: 4 }, 48: { cols: 8, rows: 6 } };
  const MAXW = 720;
  const $ = (s) => document.querySelector(s);
  const stage = $('#stage'), board = $('#board'), ghost = $('#ghost'), gridC = $('#grid');
  const reveal = $('#reveal'), finalC = $('#final'), plate = $('#nameplate');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- seeded random ---------- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- the night-sky picture (no name on it; the name is revealed at the end) ---------- */
  function glow(g, x, y, r, col) {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, col);
    gr.addColorStop(1, col.replace(/[\d.]+\)$/, '0)'));
    g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  function sparkle(g, x, y, r, color, alpha, halo) {
    g.save(); g.translate(x, y); g.globalAlpha *= (alpha == null ? 1 : alpha);
    if (halo) {
      const h = g.createRadialGradient(0, 0, 0, 0, 0, r * 1.9);
      h.addColorStop(0, 'rgba(255,236,190,0.4)'); h.addColorStop(1, 'rgba(255,236,190,0)');
      g.fillStyle = h; g.fillRect(-r * 2, -r * 2, r * 4, r * 4);
    }
    const k = r * 0.13;
    g.beginPath(); g.moveTo(0, -r);
    g.quadraticCurveTo(k, -k, r, 0); g.quadraticCurveTo(k, k, 0, r);
    g.quadraticCurveTo(-k, k, -r, 0); g.quadraticCurveTo(-k, -k, 0, -r);
    g.closePath(); g.fillStyle = color; g.fill(); g.restore();
  }
  function paintScene() {
    const W = 1800, H = 1200, c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d'), R = rng(11);
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#080b25'); sky.addColorStop(0.45, '#1a1b55'); sky.addColorStop(0.75, '#3d2a7a'); sky.addColorStop(1, '#8a4a85');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    glow(g, W * 0.22, H * 0.55, 560, 'rgba(110,80,200,.22)');
    glow(g, W * 0.82, H * 0.62, 520, 'rgba(200,100,150,.16)');
    glow(g, W * 0.5, H * 0.18, 640, 'rgba(60,70,170,.26)');

    for (let i = 0; i < 280; i++) {
      const x = R() * W, y = R() * H * 0.86, r = 0.8 + R() * R() * 2.8;
      g.globalAlpha = 0.3 + R() * 0.7; g.fillStyle = R() < 0.2 ? '#ffe9b0' : '#ffffff';
      g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    g.globalAlpha = 1;
    for (let i = 0; i < 18; i++) {
      const x = R() * W, y = R() * H * 0.8;
      if (x > W * 0.66 && y < H * 0.45) continue;
      sparkle(g, x, y, 9 + R() * 14, R() < 0.5 ? '#fff4d0' : '#ffffff', 0.9, true);
    }

    // a constellation shaped like the letter M
    const M = [[0.10, 0.38], [0.15, 0.16], [0.215, 0.32], [0.28, 0.16], [0.33, 0.38]];
    g.strokeStyle = 'rgba(255,233,176,.5)'; g.lineWidth = 2.5; g.lineJoin = 'round';
    g.beginPath(); M.forEach(([x, y], i) => (i ? g.lineTo(x * W, y * H) : g.moveTo(x * W, y * H))); g.stroke();
    M.forEach(([x, y], i) => sparkle(g, x * W, y * H, i % 2 ? 34 : 28, '#fff2c4', 1, true));

    // shooting star
    const sx0 = W * 0.56, sy0 = H * 0.06, sx1 = W * 0.43, sy1 = H * 0.16;
    const tail = g.createLinearGradient(sx0, sy0, sx1, sy1);
    tail.addColorStop(0, 'rgba(255,240,200,0)'); tail.addColorStop(1, 'rgba(255,240,200,.95)');
    g.strokeStyle = tail; g.lineWidth = 5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(sx0, sy0); g.lineTo(sx1, sy1); g.stroke();
    sparkle(g, sx1, sy1, 22, '#ffffff', 1, true);

    // crescent moon
    const mx = W * 0.8, my = H * 0.27, mr = H * 0.165;
    glow(g, mx, my, mr * 3.2, 'rgba(255,226,150,.30)');
    const s = Math.ceil(mr * 2.4), mc = s / 2, o = document.createElement('canvas'); o.width = o.height = s;
    const m = o.getContext('2d'), mg = m.createLinearGradient(mc - mr, mc - mr, mc + mr, mc + mr);
    mg.addColorStop(0, '#fff6d6'); mg.addColorStop(0.6, '#f6d98c'); mg.addColorStop(1, '#d9a94a');
    m.fillStyle = mg; m.beginPath(); m.arc(mc, mc, mr, 0, Math.PI * 2); m.fill();
    m.globalCompositeOperation = 'destination-out';
    m.beginPath(); m.arc(mc + mr * 0.46, mc - mr * 0.14, mr * 0.86, 0, Math.PI * 2); m.fill();
    g.save(); g.shadowColor = 'rgba(255,220,140,.85)'; g.shadowBlur = 60; g.drawImage(o, mx - mc, my - mc); g.restore();
    sparkle(g, mx + mr * 0.2, my - mr * 0.02, 30, '#fff6d8', 1, true);

    // soft clouds on the horizon
    [[0.2, 0.8, 420, 0.2], [0.55, 0.85, 520, 0.18], [0.85, 0.79, 380, 0.2], [0.38, 0.88, 340, 0.16]].forEach(([fx, fy, w, a]) => {
      g.save(); g.translate(fx * W, fy * H); g.scale(1, 0.16);
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, w);
      gr.addColorStop(0, 'rgba(232,150,192,' + a + ')'); gr.addColorStop(1, 'rgba(232,150,192,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(0, 0, w, 0, 7); g.fill(); g.restore();
    });

    // rolling hills
    const hill = (base, amp, f1, f2, ph, col) => {
      g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
      for (let x = 0; x <= W; x += 12) g.lineTo(x, base + Math.sin(x * f1 + ph) * amp + Math.sin(x * f2 + ph * 1.7) * amp * 0.45);
      g.lineTo(W, H); g.closePath(); g.fill();
    };
    hill(H * 0.84, 26, 0.0042, 0.011, 1, '#33267a');
    hill(H * 0.90, 22, 0.0035, 0.009, 3, '#1b1a54');
    hill(H * 0.955, 14, 0.005, 0.012, 5, '#0d1032');

    const v = g.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, W * 0.75);
    v.addColorStop(0, 'rgba(5,6,22,0)'); v.addColorStop(1, 'rgba(5,6,22,.45)');
    g.fillStyle = v; g.fillRect(0, 0, W, H);
    return c;
  }
  const scene = paintScene();

  /* ---------- jigsaw geometry ---------- */
  let S, pieces = [], cols, rows, pw, ph, bw, bh, pad, bl, dpr, H_, V_, stageW, stageH, zTop = 10, drag = null, lastW = 0;
  let soundOn = true, guideOn = true;

  function makeEdges(seed) {
    const R = rng(seed); H_ = []; V_ = [];
    for (let r = 0; r <= rows; r++) { H_[r] = []; for (let c = 0; c < cols; c++) H_[r][c] = (r === 0 || r === rows) ? 0 : (R() < 0.5 ? 1 : -1); }
    for (let r = 0; r < rows; r++) { V_[r] = []; for (let c = 0; c <= cols; c++) V_[r][c] = (c === 0 || c === cols) ? 0 : (R() < 0.5 ? 1 : -1); }
  }
  function edgeTo(p, ax, ay, bx, by, nx, ny, dir) {
    if (!dir) { p.lineTo(bx, by); return; }
    const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    const pt = (a, b) => [ax + ux * a * L + nx * (-b) * dir * L, ay + uy * a * L + ny * (-b) * dir * L];
    p.bezierCurveTo(...pt(0.2, 0), ...pt(0.5, 0), ...pt(0.4, -0.1));
    p.bezierCurveTo(...pt(0.3, -0.3), ...pt(0.7, -0.3), ...pt(0.6, -0.1));
    p.bezierCurveTo(...pt(0.5, 0), ...pt(0.8, 0), ...pt(1, 0));
  }
  function piecePath(r, c, ox, oy) {
    const p = new Path2D(), x0 = ox, y0 = oy, x1 = ox + pw, y1 = oy + ph;
    p.moveTo(x0, y0);
    edgeTo(p, x0, y0, x1, y0, 0, -1, -H_[r][c]);
    edgeTo(p, x1, y0, x1, y1, 1, 0, V_[r][c + 1]);
    edgeTo(p, x1, y1, x0, y1, 0, 1, H_[r + 1][c]);
    edgeTo(p, x0, y1, x0, y0, -1, 0, -V_[r][c]);
    p.closePath(); return p;
  }
  function sizeCanvas(cv, w, h) {
    cv.width = Math.ceil(w * dpr); cv.height = Math.ceil(h * dpr);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    g.imageSmoothingQuality = 'high'; return g;
  }

  /* ---------- build the board and pieces ---------- */
  function build() {
    const cfg = LEVELS[S.n]; cols = cfg.cols; rows = cfg.rows;
    stageW = Math.floor(stage.clientWidth); lastW = stageW;
    pw = Math.floor(Math.min(stageW, MAXW) / cols); bw = pw * cols;
    ph = Math.floor(bw * 2 / 3 / rows); bh = ph * rows;
    pad = Math.ceil(0.3 * Math.max(pw, ph)) + 2;
    bl = Math.floor((stageW - bw) / 2);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    stage.style.setProperty('--bw', bw + 'px');
    [board, reveal].forEach((el) => Object.assign(el.style, { left: bl + 'px', top: '0px', width: bw + 'px', height: bh + 'px' }));
    makeEdges(S.seed);

    let g = sizeCanvas(ghost, bw, bh); g.globalAlpha = 0.3; g.drawImage(scene, 0, 0, bw, bh);
    g = sizeCanvas(gridC, bw, bh); g.strokeStyle = 'rgba(251,240,207,.17)'; g.lineWidth = 1;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { g.save(); g.translate(c * pw, r * ph); g.stroke(piecePath(r, c, 0, 0)); g.restore(); }
    g = sizeCanvas(finalC, bw, bh); g.drawImage(scene, 0, 0, bw, bh);

    pieces.forEach((p) => p.el.remove()); pieces = [];
    if (S.done) { stage.style.height = bh + 'px'; return; }

    const n = S.n, gap = Math.round(Math.max(22, ph * 0.35)), trayTop = bh + gap;
    const tc = Math.max(2, Math.floor(stageW / (pw * 0.95))), trRows = Math.ceil(n / tc), cw = stageW / tc, ch = Math.round(ph * 0.95);
    stageH = trayTop + trRows * ch + Math.round(ph * 0.35);
    stage.style.height = stageH + 'px';

    const order = [...Array(n).keys()];
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }

    for (let id = 0; id < n; id++) {
      const r = Math.floor(id / cols), c = id % cols, path = piecePath(r, c, pad, pad);
      const el = document.createElement('canvas'); el.className = 'piece';
      const w = pw + 2 * pad, h = ph + 2 * pad;
      const pg = sizeCanvas(el, w, h);
      pg.save(); pg.clip(path); pg.drawImage(scene, 0, 0, scene.width, scene.height, pad - c * pw, pad - r * ph, bw, bh); pg.restore();
      pg.save(); pg.clip(path); pg.lineWidth = 3; pg.strokeStyle = 'rgba(5,6,25,.5)'; pg.stroke(path); pg.restore();
      pg.lineWidth = 1.1; pg.strokeStyle = 'rgba(255,240,200,.38)'; pg.stroke(path);

      const k = order.indexOf(id), tx = bl + c * pw, ty = r * ph;
      const p = { id, r, c, el, path, tx, ty, x: 0, y: 0, z: 10 + k, placed: false };
      if (S.placed.has(id)) {
        p.placed = true; p.x = tx; p.y = ty; el.classList.add('placed'); el.style.zIndex = 1;
      } else {
        const col = k % tc, row = Math.floor(k / tc);
        p.x = cw * col + cw / 2 - pw / 2 + (Math.random() - 0.5) * pw * 0.3;
        p.y = trayTop + row * ch + (Math.random() - 0.5) * ch * 0.25;
        clampPiece(p); el.style.zIndex = p.z;
      }
      place(p); stage.appendChild(el); pieces.push(p);
    }
    updateProgress();
  }
  function clampPiece(p) {
    p.x = Math.max(4, Math.min(p.x, stageW - pw - 4));
    p.y = Math.max(0, Math.min(p.y, stageH - ph));
  }
  function place(p) { p.el.style.transform = 'translate(' + (p.x - pad) + 'px,' + (p.y - pad) + 'px)'; }

  /* ---------- picking and dragging ---------- */
  const hitCtx = document.createElement('canvas').getContext('2d');
  function pickPiece(px, py) {
    let best = null;
    for (const p of pieces) {
      if (p.placed) continue;
      const lx = px - (p.x - pad), ly = py - (p.y - pad);
      if (lx < 0 || ly < 0 || lx > pw + 2 * pad || ly > ph + 2 * pad) continue;
      if (hitCtx.isPointInPath(p.path, lx, ly) && (!best || p.z > best.z)) best = p;
    }
    return best;
  }
  const toStage = (e) => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

  stage.addEventListener('touchstart', (e) => {
    if (S.done || !e.touches[0]) return;
    const t = e.touches[0], r = stage.getBoundingClientRect();
    if (pickPiece(t.clientX - r.left, t.clientY - r.top)) e.preventDefault();
  }, { passive: false });

  stage.addEventListener('pointerdown', (e) => {
    if (S.done || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const pt = toStage(e), p = pickPiece(pt.x, pt.y);
    if (!p) return;
    ensureAudio();
    drag = { p, dx: pt.x - p.x, dy: pt.y - p.y, id: e.pointerId };
    p.z = ++zTop; p.el.style.zIndex = p.z; p.el.style.transition = 'none'; p.el.classList.add('lift');
    stage.classList.add('dragging');
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  stage.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const pt = toStage(e), p = drag.p;
    p.x = pt.x - drag.dx; p.y = pt.y - drag.dy; clampPiece(p); place(p);
    if (e.clientY < 70) window.scrollBy(0, -14); else if (e.clientY > innerHeight - 70) window.scrollBy(0, 14);
  });
  const endDrag = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const p = drag.p; drag = null; stage.classList.remove('dragging'); p.el.classList.remove('lift');
    trySnap(p);
  };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  function trySnap(p) {
    if (Math.hypot(p.x - p.tx, p.y - p.ty) > Math.min(pw, ph) * 0.35) return;
    p.x = p.tx; p.y = p.ty; p.el.style.transition = 'transform .14s ease-out'; place(p);
    p.placed = true; p.z = 0; p.el.style.zIndex = 1; p.el.classList.add('placed');
    S.placed.add(p.id); chime(); updateProgress();
    $('#live').textContent = 'Piece placed. ' + S.placed.size + ' of ' + S.n + '.';
    if (S.placed.size === S.n) setTimeout(() => finish(true), 350);
  }

  /* ---------- progress, header, state ---------- */
  function updateProgress() {
    $('#count').textContent = S.placed.size + ' of ' + S.n + ' in place';
    $('#fill').style.width = (S.placed.size / S.n * 100) + '%';
  }
  function setHeader() {
    $('#title').textContent = S.done ? 'Meet our little star' : 'Who is our newest little star?';
    $('#sub').textContent = S.done ? 'Welcome to the world, ' + FULL + '.'
      : 'Drag each piece into the night sky. The faint guide shows where things go, and the last piece reveals her name.';
    $('#btnReveal').hidden = S.done; $('#btnReplay').hidden = !S.done;
    stage.classList.toggle('done', S.done);
    document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.n === S.n)));
  }
  function newGame(n) {
    S = { n: n || (S && S.n) || (innerWidth < 640 ? 12 : 24), seed: (Math.random() * 1e9) | 0, placed: new Set(), done: false };
    reveal.classList.remove('on'); setHeader(); build(); updateProgress();
  }

  /* ---------- the reveal ---------- */
  plate.innerHTML = '<p class="np-kicker">Introducing</p>'
    + '<h2 class="np-first" aria-label="' + FIRST + '">' + [...FIRST].map((ch, i) => '<span aria-hidden="true" style="--i:' + i + '">' + ch + '</span>').join('') + '</h2>'
    + '<p class="np-rest">' + REST + '</p>';

  function finish(animate) {
    if (S.done) return;
    S.done = true; setHeader(); stage.style.height = bh + 'px';
    $('#live').textContent = 'Puzzle complete. Meet ' + FULL + '.';
    requestAnimationFrame(() => reveal.classList.add('on'));
    if (animate) setTimeout(() => { burst(); arpeggio(); }, 1100);
    try { board.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' }); } catch (e) {}
  }
  function revealNow() {
    if (S.done) return; ensureAudio();
    pieces.forEach((p) => {
      if (p.placed) return;
      p.placed = true; S.placed.add(p.id); p.x = p.tx; p.y = p.ty;
      p.el.style.transition = 'transform .55s cubic-bezier(.2,.7,.2,1)'; place(p);
      p.el.classList.add('placed'); p.el.style.zIndex = 1;
    });
    updateProgress(); setTimeout(() => finish(true), 700);
  }
  function replay() {
    reveal.classList.remove('on'); void reveal.offsetWidth; ensureAudio();
    setTimeout(() => { reveal.classList.add('on'); setTimeout(() => { burst(); arpeggio(); }, 1100); }, 350);
  }

  /* ---------- sound ---------- */
  let ac = null;
  function ensureAudio() {
    try {
      if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) {}
  }
  function tone(freq, t0, dur, vol) {
    try {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }
  function chime() { if (!soundOn || !ac) return; const f = [784, 988, 1175][S.placed.size % 3]; tone(f, 0, 0.35, 0.06); tone(f * 2, 0, 0.2, 0.02); }
  function arpeggio() { if (!soundOn || !ac) return; [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, i * 0.14, 1, 0.07)); }

  /* ---------- star burst ---------- */
  const fx = $('#fx'), fg = fx.getContext('2d'); let parts = [], raf = 0;
  function burst() {
    if (reduce) return;
    const d = Math.min(window.devicePixelRatio || 1, 2);
    fx.width = innerWidth * d; fx.height = innerHeight * d; fg.setTransform(d, 0, 0, d, 0, 0);
    const br = board.getBoundingClientRect(), cx = br.left + br.width / 2, cy = br.top + br.height / 2;
    const cols2 = ['#f2d38b', '#fff6d8', '#ffffff', '#e7a1bd', '#9fb0ff'];
    for (let i = 0; i < 150; i++) {
      const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 10;
      parts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3, r: 4 + Math.random() * 10, life: 0, max: 110 + Math.random() * 90, c: cols2[i % cols2.length], star: Math.random() < 0.65 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    fg.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter((p) => p.life < p.max);
    for (const p of parts) {
      p.life++; p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.14; p.x += p.vx; p.y += p.vy;
      const k = 1 - p.life / p.max; fg.globalAlpha = Math.max(0, k);
      if (p.star) sparkle(fg, p.x, p.y, p.r * (0.5 + k * 0.5), p.c, 1, false);
      else { fg.fillStyle = p.c; fg.beginPath(); fg.arc(p.x, p.y, p.r * 0.3, 0, 7); fg.fill(); }
    }
    fg.globalAlpha = 1;
    raf = parts.length ? requestAnimationFrame(tick) : 0;
    if (!parts.length) fg.clearRect(0, 0, innerWidth, innerHeight);
  }

  /* ---------- controls ---------- */
  document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => { ensureAudio(); newGame(+b.dataset.n); }));
  $('#btnShuffle').addEventListener('click', () => { ensureAudio(); newGame(); });
  $('#btnReveal').addEventListener('click', revealNow);
  $('#btnReplay').addEventListener('click', replay);
  $('#btnGuide').addEventListener('click', (e) => { guideOn = !guideOn; stage.classList.toggle('noguide', !guideOn); e.currentTarget.setAttribute('aria-pressed', String(guideOn)); });
  $('#btnSound').addEventListener('click', (e) => { soundOn = !soundOn; if (soundOn) ensureAudio(); e.currentTarget.setAttribute('aria-pressed', String(soundOn)); });
  const btnFull = $('#btnFull');
  if (!document.fullscreenEnabled) btnFull.hidden = true;
  btnFull.addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  });

  let rt = 0;
  new ResizeObserver(() => {
    const w = Math.floor(stage.clientWidth);
    if (w && w !== lastW) { clearTimeout(rt); rt = setTimeout(build, 120); }
  }).observe(stage);

  newGame();
})();
</script>

</body></html>
